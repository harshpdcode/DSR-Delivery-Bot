name: DSR Delivery Bot CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build Docker Images & Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # You would configure Docker Hub or GCP / AWS Container Registry credentials here
      # - name: Log in to Docker Registry
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false # Set to true when registry login is configured
          tags: dsr_delivery_bot/backend:latest,dsr_delivery_bot/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false # Set to true when registry login is configured
          tags: dsr_delivery_bot/frontend:latest,dsr_delivery_bot/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

