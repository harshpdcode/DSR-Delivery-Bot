name: DSR Delivery Bot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # â”€â”€ Backend CI â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint and Format Check (Ruff)
        run: |
          ruff check backend/app
          ruff format --check backend/app

      # Note: Database & Redis services can be added using Docker service containers
      # if we want to run full integration tests.
      - name: Run Unit Tests
        env:
          POSTGRES_USER: dsr_delivery_bot_user
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: dsr_delivery_bot_test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: testsecretkeymustbelongenoughformostalgorithms
          APP_ENV: testing
        run: |
          cd backend
          # Run tests (mocking external dependencies where necessary)
          # pytest

  # â”€â”€ Frontend CI â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  frontend-build:
    name: Frontend Lint & Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Check
        run: |
          cd frontend
          npm run lint

      - name: Type Check
        run: |
          cd frontend
          npm run type-check

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.test
        run: |
          cd frontend
          npm run build
